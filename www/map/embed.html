<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mapa Znečištění - Senzorvzduchu.cz</title>
    <meta name="description" content="Největší sjednocená mapa kvality ovzduší v ČR. Spojuje 6 sítí senzorů (Sensor.Community, ČHMÚ, PurpleAir, Smart Citizen, Libčich, AirGradient) – PM2.5, PM10, NO₂, O₃, hluk, teplota a vlhkost (reference: meteostanice ČHMÚ), interpolace, vítr a pětidenní historie.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Senzorvzduchu.cz">
    <meta property="og:locale" content="cs_CZ">
    <meta property="og:url" content="https://senzorvzduchu.cz/map/embed.html">
    <meta property="og:title" content="Mapa kvality ovzduší v ČR – Senzorvzduchu.cz">
    <meta property="og:description" content="Největší sjednocená mapa kvality ovzduší v ČR. Spojuje 6 sítí senzorů (Sensor.Community, ČHMÚ, PurpleAir, Smart Citizen, Libčich, AirGradient) – PM2.5, PM10, NO₂, O₃, hluk, teplota a vlhkost (reference: meteostanice ČHMÚ), interpolace, vítr a pětidenní historie.">
    <meta property="og:image" content="https://senzorvzduchu.cz/map/OG-card-image-mapa-web.jpg">
    <meta property="og:image:alt" content="Mapa kvality ovzduší v České republice – Senzorvzduchu.cz">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mapa kvality ovzduší v ČR – Senzorvzduchu.cz">
    <meta name="twitter:description" content="Největší sjednocená mapa kvality ovzduší v ČR. Spojuje 6 sítí senzorů – PM2.5, PM10, NO₂, O₃, hluk, teplota a vlhkost a pětidenní historie.">
    <meta name="twitter:image" content="https://senzorvzduchu.cz/map/OG-card-image-mapa-web.jpg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css?v=3.2">
    <style>
        /* === EMBED: kompaktní rozložení pro iframe (všechny velikosti) === */
        .pollutant-bar { padding: 4px; gap: 2px; }
        .pollutant-chip { font-size: 11px; padding: 5px 9px; }
        .pollutant-chip.pollutant-info { font-size: 12px; padding: 5px 8px; }

        .legend { padding: 6px 8px; min-width: 110px; }
        .legend-title { font-size: 11px; }
        .legend-item { font-size: 8px; margin: 2px 0; }
        .legend-color { width: 9px; height: 9px; margin-right: 5px; }
        .legend-basemap { display: none; }

        .update-indicator { padding: 4px 8px; gap: 1px; }
        .update-row { font-size: 10px; gap: 5px; }
        .update-subtitle { display: none; }

        .leaflet-popup-content-wrapper { min-width: 210px; }
        .popup-header { padding: 7px 38px 7px 10px; font-size: 12px; }
        .popup-content-body { padding: 10px; }
        .popup-pm-value { font-size: 26px; }
        .popup-detail { font-size: 11px; }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Lišta látek (app.js; ℹ v info.js) -->
    <div class="pollutant-bar" id="pollutantBar" role="tablist" aria-label="Výběr veličiny">
        <button class="pollutant-chip" data-pollutant="pm25">PM2.5</button>
        <button class="pollutant-chip" data-pollutant="pm10">PM10</button>
        <button class="pollutant-chip" data-pollutant="no2">NO₂</button>
        <button class="pollutant-chip" data-pollutant="o3">O₃</button>
        <button class="pollutant-chip" data-pollutant="noise">🔊 Hluk</button>
        <button class="pollutant-chip" data-pollutant="temperature">🌡 Teplota</button>
        <button class="pollutant-chip" data-pollutant="humidity">💧 Vlhkost</button>
        <button class="pollutant-chip pollutant-info" id="infoChip" title="Jak mapa funguje">ℹ</button>
    </div>

    <div class="update-indicator">
        <div class="update-row">
            <div class="status-dot"></div>
            <span class="update-label">Aktualizováno:</span>
            <span id="lastUpdate" style="font-weight: 600;">Načítám...</span>
        </div>
        <div class="update-subtitle">hodinové průměry</div>
    </div>

    <div class="legend">
        <div class="legend-header" id="legendHeader">
            <div class="legend-title" id="legendTitle">PM2.5 (μg/m³)</div>
            <div class="legend-toggle" id="legendToggle">▼</div>
        </div>
        <div class="legend-content" id="legendContent">
            <div id="legendBands"><!-- pásma podle látky vykresluje app.js --></div>
            <div class="legend-sources">
                <div class="legend-source-item" data-layer="community"><span class="src-dot src-sc"></span>Sensor.Community</div>
                <div class="legend-source-item" data-layer="chmi" title="Stanice kvality ovzduší; u teploty a vlhkosti meteorologické stanice ČHMÚ (otevřená data)"><span class="src-dot src-chmi"></span>ČHMÚ (oficiální)</div>
                <div class="legend-source-item" data-layer="sck"><span class="src-dot src-sck"></span>Smart Citizen</div>
                <div class="legend-source-item" data-layer="purpleair"><span class="src-dot src-pa"></span>PurpleAir</div>
                <div class="legend-source-item" data-layer="airgradient" title="Data: AirGradient (CC BY-SA 4.0)"><span class="src-dot src-ag"></span>AirGradient</div>
                <div class="legend-source-item" data-layer="libcich"><span class="src-dot src-lib"></span>Libčich<span class="legend-zoom" id="zoomLibcich" title="Přiblížit na Libčice">⌖</span></div>
                <div class="legend-source-item" data-layer="wind" id="windToggleRow" title="Aktuální vítr (Open-Meteo)"><span class="src-dot src-wind"></span>Vítr</div>
                <div class="legend-source-item" data-layer="interp" id="interpToggleRow" title="Odhad mezi senzory (IDW)"><span class="src-dot src-interp"></span>Interpolace (odhad)</div>
            </div>
            <div class="legend-basemap">
                <span>Podklad:</span>
                <button class="basemap-btn" data-basemap="light">Světlá</button>
                <button class="basemap-btn" data-basemap="voyager">Barevná</button>
                <button class="basemap-btn" data-basemap="osm">OSM</button>
            </div>
            <div class="legend-info-link" id="infoLink">ℹ Jak mapa funguje</div>
        </div>
    </div>

    <!-- Výstraha ČHMÚ na kvalitu ovzduší (alerts.js; skrytá, dokud žádná neplatí) -->
    <div class="nc-alert" id="ncAlert" hidden></div>

    <!-- Modal (metodika, info.js) -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
    </div>

    <div class="toast" id="toast" style="display:none;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>

    <script src="app.js?v=3.2"></script>
    <script src="interp.js?v=3.0"></script>
    <script src="wind.js?v=2.8"></script>
    <script src="info.js?v=3.1"></script>
    <script src="alerts.js?v=2.8"></script>
</body>

</html>
